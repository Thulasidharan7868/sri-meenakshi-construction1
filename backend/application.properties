spring.application.name=construction-backend

# ---------------------------------------------------------------
# Server  (Railway/other hosts inject PORT; defaults to 8080 locally)
# ---------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------
# MySQL
# Local:   set DB_PASSWORD (and DB_USERNAME if not root), or edit the defaults.
# Railway: MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER / MYSQLPASSWORD
#          are injected automatically by the Railway MySQL plugin.
# A full JDBC URL can also be supplied via SPRING_DATASOURCE_URL.
# ---------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sri_meenakshi_construction}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:Thulasi@060!}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Mail (Gmail SMTP). Use a Gmail *App Password*, not your login password.
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables.
# If mail is not configured, contact messages are still saved to the
# database; only the notification email is skipped (see EmailService).
# ---------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:thulasidharanmoorthy42@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xibi salp rtkr wjfn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
